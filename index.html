<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Study Grove</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <section>
                <h1>Next Exam</h1>
                <p>No exam added yet.</p>
                    <form>
                        <label for="exam-name">Exam Name:</label>
                        <input type="text" id="exam-name" name="exam-name" required>
                        <label for="exam-date">Exam Date:</label>
                        <input type="date" id="exam-date" name="exam-date" required>
                        <button type="submit">Add Exam</button>
                    </form>
            </section>

            <section>
                <h1>Study Sessions</h1>
                <p>No study sessions added yet.</p>
                    <label for="session-name">Session subject/topic:</label>
                    <input type="text" id="session-name" name="session-name" required>
                    
                            <div id="timer-display">00:00:00</div>
                        <div class="timer-container">
                            <button type="button" id="start-btn" aria-label="Start">
                                <img src="Assets/start-btn.png" alt="">
                            </button>
                            <button type="button" id="pause-btn">
                                <img src="Assets/pause-btn.png" alt="">
                            </button>
                            
                            <button type="button" id="finish-btn" aria-label="Finish session">
                                <img src="Assets/stop-btn.png" alt="">
                            </button>
                        </div>
            </section>
            <section>
                <h1>Today's study</h1>
                <p>No study sessions Today yet.</p>
            </section>
            <section>
                <h1>Study archive</h1>
                <p>No completed sessions yet.</p>
            </section>
        </main>
        <script src="app.js"></script>
    </body>
</html>
